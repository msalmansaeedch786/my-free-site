name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: "gen-lang-client-0111574187"
  REGION: "us-central1"
  REPO_NAME: "my-free-site-repo"
  IMAGE_NAME: "my-free-site"

jobs:
  test-and-lint:
    name: Run Tests and Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Run Black Formatter Check
        run: black --check .
        
      - name: Run Pytest
        run: PYTHONPATH=. pytest tests/ -v

  build-and-deploy:
    name: Build, Push, and Deploy via Terraform
    needs: test-and-lint
    # Only deploy on push to main, not on PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URL=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          
          docker build -t $IMAGE_URL .
          docker push $IMAGE_URL

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate
        
      - name: Terraform Plan
        run: terraform plan -var="image_tag=${{ github.sha }}" -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
