<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Instantly see your IP address, browser, operating system, and device. Free, fast, and private — no tracking, no ads.">
    <meta name="theme-color" content="#030014">
    <title>Connection Identity — What's My IP?</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="aurora-container" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grid-overlay" aria-hidden="true"></div>
    
    <main class="container" role="main">
        <h1>
            <div class="icon-pulse" aria-hidden="true"></div>
            Identity Verified
        </h1>
        
        <section class="data-card" aria-label="IP Address">
            <div class="label" id="label-ip">IP Address</div>
            <div class="value" aria-labelledby="label-ip">
                <span class="ip-highlight" id="ip-value">{{ ip_address }}</span>
                <button class="copy-btn" id="copy-ip-btn" onclick="copyIP()" aria-label="Copy IP address to clipboard">Copy</button>
            </div>
        </section>

        <section class="data-card" aria-label="Browser">
            <div class="label" id="label-browser">Browser</div>
            <div class="value" aria-labelledby="label-browser">{{ browser }}</div>
        </section>

        <section class="data-card" aria-label="Operating System">
            <div class="label" id="label-os">Operating System</div>
            <div class="value" aria-labelledby="label-os">{{ os_name }}</div>
        </section>

        <section class="data-card" aria-label="Device Type">
            <div class="label" id="label-device">Device Type</div>
            <div class="value" aria-labelledby="label-device">{{ device }}</div>
        </section>

        <footer class="site-footer">
            Secured by <span>Google Cloud Run</span>
        </footer>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
